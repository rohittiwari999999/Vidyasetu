name: Build Official Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile 30MB Official Flutter Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build Core Package
        run: |
          cd packages/core_shared
          flutter pub get

      - name: Ensure Google Services Configuration
        run: |
          mkdir -p apps/school_management_app/android/app/src/release
          cat << 'EOF' > apps/school_management_app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "715255586358",
              "project_id": "vidyasetu-school-management",
              "storage_bucket": "vidyasetu-school-management.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:715255586358:android:a1b2c3d4e5f60718293a4b",
                  "android_client_info": {
                    "package_name": "in.vidyasetu.management"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildCompilationOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp apps/school_management_app/android/app/google-services.json apps/school_management_app/android/app/src/release/google-services.json

          mkdir -p apps/student_parent_app/android/app/src/release
          cat << 'EOF' > apps/student_parent_app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "715255586358",
              "project_id": "vidyasetu-school-management",
              "storage_bucket": "vidyasetu-school-management.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:715255586358:android:b2c3d4e5f60718293a4b5c",
                  "android_client_info": {
                    "package_name": "in.vidyasetu.student"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildCompilationOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp apps/student_parent_app/android/app/google-services.json apps/student_parent_app/android/app/src/release/google-services.json

      - name: Build App 1 (School Management App)
        run: |
          cd apps/school_management_app
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Build App 2 (Student & Parent App)
        run: |
          cd apps/student_parent_app
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Staff Management APK (30 MB)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Staff-Management-Release-APK
          path: apps/school_management_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Staff Management AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Staff-Management-Release-AAB
          path: apps/school_management_app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Student Parent APK (30 MB)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Student-Parent-Release-APK
          path: apps/student_parent_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Student Parent AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Student-Parent-Release-AAB
          path: apps/student_parent_app/build/app/outputs/bundle/release/app-release.aab
