                  {
                    "client_id": "1064474396247-9aq4lafl7agtt2qj07bvejk4noidhm8s.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAC6Tw4VuZKhJymPCPm4Z5vVn9Y_a7j23A"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1064474396247-9aq4lafl7agtt2qj07bvejk4noidhm8s.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp apps/school_management_app/android/app/google-services.json apps/school_management_app/android/app/src/release/google-services.json

          mkdir -p apps/student_parent_app/android/app/src/release
          cat << 'EOF' > apps/student_parent_app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "715255586358",
              "project_id": "vidyasetu-school-management",
              "storage_bucket": "vidyasetu-school-management.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:715255586358:android:b2c3d4e5f60718293a4b5c",
                  "android_client_info": {
                    "package_name": "in.vidyasetu.student"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildCompilationOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp apps/student_parent_app/android/app/google-services.json apps/student_parent_app/android/app/src/release/google-services.json

      - name: Ensure Android Launcher Icons
        run: |
          python3 -c "
          import struct, zlib, os

          def make_png(width, height, r, g, b):
              png = b'\x89PNG\r\n\x1a\n'
              ihdr_data = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              ihdr = struct.pack('>I', len(ihdr_data)) + b'IHDR' + ihdr_data + struct.pack('>I', zlib.crc32(b'IHDR' + ihdr_data))
              raw = (b'\x00' + bytes([r, g, b]) * width) * height
              compressed = zlib.compress(raw)
              idat = struct.pack('>I', len(compressed)) + b'IDAT' + compressed + struct.pack('>I', zlib.crc32(b'IDAT' + compressed))
              iend = struct.pack('>I', 0) + b'IEND' + struct.pack('>I', zlib.crc32(b'IEND'))
              return png + ihdr + idat + iend

          def create_all(app_path, r, g, b):
              res_path = os.path.join(app_path, 'android/app/src/main/res')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              for folder, size in sizes.items():
                  dir_p = os.path.join(res_path, folder)
                  os.makedirs(dir_p, exist_ok=True)
                  data = make_png(size, size, r, g, b)
                  with open(os.path.join(dir_p, 'ic_launcher.png'), 'wb') as f:
                      f.write(data)

          create_all('apps/school_management_app', 99, 102, 241)
          create_all('apps/student_parent_app', 16, 185, 129)
          "

      - name: Ensure Keystore Setup
        run: |
          mkdir -p apps/school_management_app/android/app
          mkdir -p apps/student_parent_app/android/app
          cp android_keys/upload-keystore.p12 apps/school_management_app/android/app/upload-keystore.p12
          cp android_keys/upload-keystore.p12 apps/student_parent_app/android/app/upload-keystore.p12

      - name: Build App 1 (School Management App)
        run: |
          cd apps/school_management_app
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Build App 2 (Student & Parent App)
        run: |
          cd apps/student_parent_app
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Staff Management APK (30 MB)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Staff-Management-Release-APK
          path: apps/school_management_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Staff Management AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Staff-Management-Release-AAB
          path: apps/school_management_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Student Parent APK (30 MB)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Student-Parent-Release-APK
          path: apps/student_parent_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Student Parent AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: VidyaSetu-Student-Parent-Release-AAB
          path: apps/student_parent_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
