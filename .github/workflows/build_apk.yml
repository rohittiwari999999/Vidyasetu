name: Build Official Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile 30MB Official Flutter Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build Core Package
        run: |
          cd packages/core_shared
          flutter pub get

      - name: Ensure Google Services Configuration
        run: |
          mkdir -p apps/school_management_app/android/app/src/release
          cat << 'EOF' > apps/school_management_app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "1064474396247",
              "project_id": "vidyasetu-2d41e",
              "storage_bucket": "vidyasetu-2d41e.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1064474396247:android:01f246dfb73fef95fb8512",
                  "android_client_info": {
                    "package_name": "in.vidyasetu.management"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1064474396247-6a5rv3m5dmiupj7fs3m4ri3vos78gb35.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "in.vidyasetu.management",
                      "certificate_hash": "3bded1490cb61fb6bf05e483977cbc6ac0053131"
                    }
