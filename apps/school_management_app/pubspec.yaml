name: school_management_app
description: VidyaSetu Indian School Management App for Principals, Managers, and Class Teachers.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  core_shared:
    path: ../../packages/core_shared
  flutter_riverpod: ^2.5.1
  google_sign_in: ^6.2.1
  go_router: ^14.0.0
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
