<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="featBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#featBg)" />

  <!-- Geometric Grid Accents -->
  <circle cx="850" cy="100" r="280" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="40" />
  <circle cx="950" cy="400" r="200" fill="none" stroke="rgba(245, 158, 11, 0.1)" stroke-width="30" />

  <!-- Left Content: Brand & Pitch -->
  <g transform="translate(60, 90)">
    <rect width="210" height="34" rx="17" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" />
    <text x="105" y="22" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FDE68A" text-anchor="middle" letter-spacing="1.5">INDIAN SCHOOL ERP (PG-12TH)</text>

    <text x="0" y="85" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">VidyaSetu</text>
    <text x="210" y="85" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="url(#gold)" letter-spacing="-1">Staff</text>

    <text x="0" y="125" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#E2E8F0">For Principals, Managers &amp; Class Teachers</text>

    <text x="0" y="170" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8" width="460">
      <tspan x="0" dy="0">✓ Pending Admissions Verification &amp; Roll Allocation</tspan>
      <tspan x="0" dy="28">✓ Daily Attendance Register with SMS to Absent Parents</tspan>
      <tspan x="0" dy="28">✓ Homework Publisher &amp; Worksheet Marks Evaluation</tspan>
      <tspan x="0" dy="28">✓ Urgent Weather / Holiday Circular Broadcast via FCM</tspan>
    </text>

    <!-- CBSE Badge -->
    <g transform="translate(0, 270)">
      <rect width="180" height="38" rx="12" fill="#4338CA" />
      <text x="90" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">CBSE / ICSE COMPLIANT</text>
    </g>
  </g>

  <!-- Right Visual: Floating Mockup Cards -->
  <g transform="translate(580, 50)">
    <!-- Dashboard Card Mockup -->
    <rect width="380" height="230" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
    <rect x="20" y="20" width="100" height="24" rx="8" fill="#4F46E5" />
    <text x="70" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PRINCIPAL KPI</text>

    <text x="20" y="80" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Today's Attendance</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#34D399">94.6%</text>

    <text x="200" y="80" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Q3 Fee Realized</text>
    <text x="200" y="115" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FCD34D">₹78.4 L</text>

    <line x1="20" y1="140" x2="360" y2="140" stroke="#334155" />

    <text x="20" y="170" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0">3 Pending Student Approvals Awaiting Verification</text>
    <rect x="20" y="185" width="340" height="30" rx="8" fill="#059669" />
    <text x="190" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓ REVIEW &amp; ASSIGN ROLL NO</text>
  </g>

  <!-- Sub card: Live classroom badge -->
  <g transform="translate(620, 310)">
    <rect width="340" height="130" rx="20" fill="url(#cardGrad)" stroke="#E11D48" stroke-width="2" />
    <circle cx="45" cy="45" r="16" fill="#F43F5E" />
    <polygon points="41,37 53,45 41,53" fill="#FFFFFF" />
    <text x="75" y="42" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Integrated Jitsi Classroom</text>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="11" fill="#FDA4AF">Class 10-A Maths Live Lecture Active</text>
    <text x="75" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34D399">38 Students Connected • AES-256 E2E</text>
  </g>
</svg>
