<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Background with rounded corners (Play Store style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Shield Base -->
  <g filter="url(#shadow)">
    <path d="M 256 70 L 390 120 C 390 280 256 400 256 430 C 256 400 122 280 122 120 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  </g>

  <!-- Open Book of Knowledge -->
  <path d="M 170 240 C 210 220 245 235 256 250 C 267 235 302 220 342 240 L 342 320 C 302 300 267 315 256 330 C 245 315 210 300 170 320 Z" fill="#FFFFFF" opacity="0.95" />
  <path d="M 256 250 L 256 330" stroke="#312E81" stroke-width="4" stroke-linecap="round" />

  <!-- Rising Sun of Education -->
  <path d="M 216 195 A 40 40 0 0 1 296 195 Z" fill="url(#goldGrad)" />
  <line x1="256" y1="135" x2="256" y2="155" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="210" y1="155" x2="225" y2="170" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="302" y1="155" x2="287" y2="170" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Subtle Emblem Text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#FCD34D" text-anchor="middle" letter-spacing="4">VIDYASETU</text>
  <text x="256" y="405" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#E0E7FF" text-anchor="middle" letter-spacing="2">STAFF &amp; MANAGEMENT</text>
</svg>
