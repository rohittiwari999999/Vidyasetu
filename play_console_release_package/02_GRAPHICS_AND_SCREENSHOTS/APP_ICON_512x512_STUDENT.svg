<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradStu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGradStu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowStu" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGradStu)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Graduation Cap & Star -->
  <g filter="url(#shadowStu)">
    <!-- Mortarboard Diamond -->
    <polygon points="256,120 410,180 256,240 102,180" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="6" />
    <path d="M 160 215 L 160 290 C 160 340 352 340 352 290 L 352 215" fill="#047857" stroke="#FFFFFF" stroke-width="6" />
    <!-- Tassel -->
    <circle cx="256" cy="180" r="10" fill="url(#goldGradStu)" />
    <path d="M 256 180 Q 320 190 350 250" stroke="url(#goldGradStu)" stroke-width="6" fill="none" />
    <polygon points="345,250 355,250 358,290 342,290" fill="url(#goldGradStu)" />
  </g>

  <!-- Central Star of Achievement -->
  <polygon points="256,360 268,390 300,392 275,412 283,442 256,425 229,442 237,412 212,392 244,390" fill="url(#goldGradStu)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowStu)" />

  <text x="256" y="475" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">VIDYASETU STUDENT</text>
</svg>
