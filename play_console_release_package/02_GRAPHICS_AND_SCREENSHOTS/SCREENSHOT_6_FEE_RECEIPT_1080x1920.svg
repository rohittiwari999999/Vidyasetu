<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg6)" />

  <text x="540" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">Online Fee Payment &amp; Receipts</text>
  <text x="540" y="225" font-family="Arial, sans-serif" font-weight="600" font-size="28" fill="#FDE68A" text-anchor="middle">Instant UPI (GPay/PhonePe/Paytm) &amp; CBSE E-Receipts</text>

  <g transform="translate(90, 300)">
    <rect width="900" height="1550" rx="60" fill="#020617" stroke="#334155" stroke-width="12" />
    <rect x="350" y="20" width="200" height="30" rx="15" fill="#1E293B" />

    <!-- Official White Receipt Document -->
    <g transform="translate(50, 100)">
      <rect width="800" height="1100" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />

      <!-- School Crest Header -->
      <circle cx="400" cy="90" r="40" fill="#1E1B4B" />
      <text x="400" y="102" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#F59E0B" text-anchor="middle">VS</text>
      <text x="400" y="170" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#0F172A" text-anchor="middle">DELHI MODERN ACADEMY</text>
      <text x="400" y="205" font-family="Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">CBSE Affiliation No: 2130894 • Institutional Area, New Delhi</text>

      <rect x="220" y="230" width="360" height="35" rx="17" fill="#DCFCE7" />
      <text x="400" y="254" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#166534" text-anchor="middle">FEE PAYMENT RECEIPT (PAID)</text>

      <line x1="40" y1="290" x2="760" y2="290" stroke="#CBD5E1" stroke-width="2" />

      <!-- Student details -->
      <text x="50" y="340" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Receipt No: <tspan font-weight="bold" fill="#0F172A">DMA/REC/2026/0894</tspan></text>
      <text x="550" y="340" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Date: <tspan font-weight="bold" fill="#0F172A">04-Oct-2026</tspan></text>

      <text x="50" y="390" font-family="Arial, sans-serif" font-size="22" fill="#0F172A">Student: <tspan font-weight="bold">Aarav Sharma (Class 10-A, Roll 12)</tspan></text>
      <text x="50" y="430" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Fee Term: <tspan font-weight="bold" fill="#4338CA">Quarter 2 (Jul - Sep 2026)</tspan></text>

      <!-- Table -->
      <rect x="50" y="470" width="700" height="50" fill="#F1F5F9" />
      <text x="70" y="502" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#334155">Particulars / Head</text>
      <text x="720" y="502" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#334155" text-anchor="end">Amount (INR ₹)</text>

      <text x="70" y="560" font-family="Arial, sans-serif" font-size="20" fill="#1E293B">Tuition &amp; Academic Term Fee</text>
      <text x="720" y="560" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1E293B" text-anchor="end">₹14,500.00</text>

      <text x="70" y="610" font-family="Arial, sans-serif" font-size="20" fill="#1E293B">School Transport Service</text>
      <text x="720" y="610" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1E293B" text-anchor="end">₹3,600.00</text>

      <text x="70" y="660" font-family="Arial, sans-serif" font-size="20" fill="#1E293B">Science &amp; Computer Lab Maintenance</text>
      <text x="720" y="660" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1E293B" text-anchor="end">₹1,200.00</text>

      <text x="70" y="710" font-family="Arial, sans-serif" font-size="20" fill="#1E293B">CBSE Examination &amp; Stationery</text>
      <text x="720" y="710" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1E293B" text-anchor="end">₹900.00</text>

      <rect x="50" y="750" width="700" height="70" fill="#EEF2FF" />
      <text x="70" y="795" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#312E81">TOTAL AMOUNT PAID (UPI):</text>
      <text x="720" y="795" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#312E81" text-anchor="end">₹20,200.00</text>

      <!-- Signature & verification -->
      <g transform="translate(50, 900)">
        <text x="0" y="30" font-family="Arial, sans-serif" font-size="16" fill="#166534">✓ Digitally Verified via VidyaSetu Accounts Core</text>
        <text x="680" y="30" font-family="Arial, sans-serif" font-size="16" fill="#64748B" text-anchor="end">Authorized Signatory (Bursar)</text>
      </g>
    </g>
  </g>
</svg>
