<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg5)" />

  <text x="540" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">Live Interactive Virtual Classroom</text>
  <text x="540" y="225" font-family="Arial, sans-serif" font-weight="600" font-size="28" fill="#F43F5E" text-anchor="middle">WebRTC &amp; Jitsi Meet • Zero External Apps Required</text>

  <g transform="translate(90, 300)">
    <rect width="900" height="1550" rx="60" fill="#020617" stroke="#334155" stroke-width="12" />
    <rect x="350" y="20" width="200" height="30" rx="15" fill="#1E293B" />

    <!-- Live Stage Box (Teacher) -->
    <g transform="translate(40, 90)">
      <rect width="820" height="650" rx="28" fill="#1E293B" stroke="#4F46E5" stroke-width="3" />
      <circle cx="410" cy="280" r="110" fill="#4338CA" />
      <text x="410" y="300" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#FFFFFF" text-anchor="middle">TEACHER</text>

      <!-- Host badge -->
      <rect x="30" y="30" width="300" height="45" rx="12" fill="rgba(0,0,0,0.7)" />
      <circle cx="50" cy="52" r="8" fill="#10B981" />
      <text x="70" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Mrs. Meenakshi Sharma (Host)</text>

      <rect x="670" y="30" width="120" height="45" rx="12" fill="#E11D48" />
      <text x="730" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">● LIVE</text>

      <text x="410" y="580" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FDE68A" text-anchor="middle">Trigonometric Identities &amp; Heights Drill</text>
    </g>

    <!-- Students Stream Grid -->
    <g transform="translate(40, 770)">
      <rect width="395" height="260" rx="20" fill="#1E293B" stroke="#334155" />
      <circle cx="197" cy="110" r="50" fill="#059669" />
      <text x="197" y="125" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">Aarav</text>
      <text x="20" y="235" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF">Aarav Sharma (You)</text>

      <g transform="translate(425, 0)">
        <rect width="395" height="260" rx="20" fill="#1E293B" stroke="#334155" />
        <circle cx="197" cy="110" r="50" fill="#D97706" />
        <text x="197" y="125" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">Ananya</text>
        <text x="20" y="235" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF">Ananya Verma (Roll 18)</text>
      </g>
    </g>

    <!-- Call Controls Bar -->
    <g transform="translate(180, 1100)">
      <circle cx="60" cy="60" r="45" fill="#334155" />
      <text x="60" y="70" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle">🎤</text>

      <circle cx="190" cy="60" r="45" fill="#334155" />
      <text x="190" y="70" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle">📹</text>

      <circle cx="320" cy="60" r="45" fill="#F59E0B" />
      <text x="320" y="70" font-family="Arial, sans-serif" font-size="28" fill="#000000" text-anchor="middle">✋</text>

      <circle cx="450" cy="60" r="45" fill="#EF4444" />
      <text x="450" y="70" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle">📞</text>
    </g>
