<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg3)" />

  <text x="540" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">Daily Digital Attendance Register</text>
  <text x="540" y="225" font-family="Arial, sans-serif" font-weight="600" font-size="28" fill="#34D399" text-anchor="middle">Class Teacher Roll Call &amp; Automated Absentee SMS</text>

  <g transform="translate(90, 300)">
    <rect width="900" height="1550" rx="60" fill="#020617" stroke="#334155" stroke-width="12" />
    <rect x="350" y="20" width="200" height="30" rx="15" fill="#1E293B" />

    <!-- Class Roster Header -->
    <rect x="40" y="100" width="820" height="140" rx="20" fill="#1E293B" />
    <text x="70" y="155" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">Class 10-A Daily Register</text>
    <text x="70" y="195" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Teacher: Mrs. Meenakshi Sharma • 42 Enrolled</text>

    <!-- Students Table List -->
    <g transform="translate(40, 270)">
      <!-- Row 1: Aarav (Present) -->
      <rect width="820" height="110" rx="16" fill="#0F172A" stroke="#334155" />
      <text x="30" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#818CF8">#12</text>
      <text x="110" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Aarav Sharma</text>
      <rect x="650" y="32" width="140" height="46" rx="12" fill="#065F46" />
      <text x="720" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34D399" text-anchor="middle">PRESENT</text>

      <!-- Row 2: Aditi (Absent) -->
      <g transform="translate(0, 130)">
        <rect width="820" height="110" rx="16" fill="#450A0A" stroke="#991B1B" />
        <text x="30" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#F87171">#02</text>
        <text x="110" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Aditi Chauhan</text>
        <rect x="650" y="32" width="140" height="46" rx="12" fill="#991B1B" />
        <text x="720" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FECACA" text-anchor="middle">ABSENT</text>
      </g>

      <!-- Row 3: Ananya (Present) -->
      <g transform="translate(0, 260)">
        <rect width="820" height="110" rx="16" fill="#0F172A" stroke="#334155" />
        <text x="30" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#818CF8">#18</text>
        <text x="110" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Ananya Verma</text>
        <rect x="650" y="32" width="140" height="46" rx="12" fill="#065F46" />
        <text x="720" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34D399" text-anchor="middle">PRESENT</text>
      </g>

      <!-- Row 4: Chirag (Late) -->
      <g transform="translate(0, 390)">
        <rect width="820" height="110" rx="16" fill="#451A03" stroke="#92400E" />
        <text x="30" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FBBF24">#05</text>
        <text x="110" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Chirag Sethi</text>
        <rect x="650" y="32" width="140" height="46" rx="12" fill="#B45309" />
        <text x="720" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FEF3C7" text-anchor="middle">LATE</text>
      </g>
    </g>

    <!-- Bottom Submit Button -->
    <g transform="translate(40, 900)">
      <rect width="820" height="75" rx="18" fill="#4F46E5" />
      <text x="410" y="47" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SAVE ATTENDANCE &amp; DISPATCH SMS ALERTS</text>
    </g>
