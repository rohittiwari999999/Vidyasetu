<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg1)" />

  <!-- Marketing Top Caption -->
  <text x="540" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">Principal &amp; Management Dashboard</text>
  <text x="540" y="225" font-family="Arial, sans-serif" font-weight="600" font-size="28" fill="#F59E0B" text-anchor="middle">Realtime Student Metrics, Fees &amp; Staff Supervision</text>

  <!-- Phone Mockup Frame -->
  <g transform="translate(90, 300)">
    <rect width="900" height="1550" rx="60" fill="#020617" stroke="#334155" stroke-width="12" />
    <!-- Notch -->
    <rect x="350" y="20" width="200" height="30" rx="15" fill="#1E293B" />

    <!-- App Header -->
    <rect x="40" y="80" width="820" height="160" rx="24" fill="#1E293B" />
    <circle cx="100" cy="160" r="40" fill="#6366F1" />
    <text x="100" y="172" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#FFFFFF" text-anchor="middle">VS</text>
    <text x="160" y="145" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#FFFFFF">Delhi Modern Academy</text>
    <text x="160" y="180" font-family="Arial, sans-serif" font-size="22" fill="#94A3B8">Dr. Sunita Mukherjee (Principal) • CBSE Affiliated</text>

    <!-- KPI Grid -->
    <g transform="translate(40, 280)">
      <!-- Box 1 -->
      <rect width="395" height="200" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />
      <text x="30" y="60" font-family="Arial, sans-serif" font-size="22" fill="#94A3B8">Total Enrolled</text>
      <text x="30" y="130" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF">1,482</text>
      <text x="30" y="170" font-family="Arial, sans-serif" font-size="18" fill="#34D399">PG to 12th Senior Sec</text>

      <!-- Box 2 -->
      <rect x="425" width="395" height="200" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />
      <text x="455" y="60" font-family="Arial, sans-serif" font-size="22" fill="#94A3B8">Today Attendance</text>
      <text x="455" y="130" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#34D399">94.6%</text>
      <text x="455" y="170" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">1,402 Present • 80 Absent</text>
    </g>

    <!-- Fee Collection Box -->
    <g transform="translate(40, 520)">
      <rect width="820" height="240" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />
      <text x="40" y="60" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8">Quarter 3 Fee Realized</text>
      <text x="40" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FCD34D">₹78.4 Lakhs</text>
      <text x="40" y="195" font-family="Arial, sans-serif" font-size="20" fill="#E2E8F0">84% of Term 3 target reached • Direct UPI/NetBanking</text>
    </g>

    <!-- Approvals Banner -->
    <g transform="translate(40, 800)">
      <rect width="820" height="200" rx="24" fill="#451A03" stroke="#F59E0B" stroke-width="3" />
      <text x="40" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FDE68A">3 Pending Admissions Awaiting Review</text>
      <text x="40" y="115" font-family="Arial, sans-serif" font-size="22" fill="#FEF3C7">Devansh Kumar (Class 10-A), Kavya Patel (Playgroup)</text>
      <rect x="40" y="135" width="280" height="45" rx="12" fill="#F59E0B" />
      <text x="180" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">VERIFY &amp; ASSIGN ROLL</text>
    </g>
  </g>
</svg>
